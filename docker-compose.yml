services:
  app-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: downloads
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
    ports:
      - "5432:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d downloads"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  app:
    build: .
    depends_on:
      app-postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      API_ADDR: :8081
      DATABASE_URL: postgres://internship:internship@app-postgres:5432/downloads?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: download-service
      MAX_CONCURRENT_DOWNLOADS: 5
      MAX_FILE_SIZE_BYTES: 10485760
      SHUTDOWN_TIMEOUT: 1m
    ports:
      - "8081:8081"

volumes:
  app-postgres-data:
  temporal-postgres-data:
